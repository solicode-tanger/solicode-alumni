<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lauréats - Solicode Alumni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <!-- GLOW BLOBS -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2" style="top: 20%; right: 10%; bottom: auto;"></div>

    <!-- NAV -->
    <nav>
        <a class="nav-logo" href="index.html">
            <img src="images/logo.png" alt="Solicode" style="height: 88px;">
            <span style="color:var(--muted); margin-left: -5px;">- ALUMNI</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html#features">Réseau</a></li>
            <li><a href="laureats.html" style="color: var(--white);">Lauréats</a></li>
            <li><a href="index.html#about">À propos</a></li>
            <li><a href="index.html#join">Rejoindre</a></li>
        </ul>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdIBmWB9w_yhSmlU2kKXzIRruyi4ViI-cz9RGdixICE_QmEcA/viewform"
            target="_blank" class="nav-cta">
            <i data-lucide="plus"></i>
            Rejoindre
        </a>
    </nav>

    <!-- LAUREATS SECTION -->
    <section class="section" style="min-height: 70vh; padding-top: 60px;">
        <div class="section-header">
            <div class="section-tag">// Communauté</div>
            <div class="section-title">Nos <span class="y">Lauréats</span> Inscrits</div>
            <p style="color: var(--muted); margin-top: 16px; max-width: 600px; line-height: 1.7;">
                Découvrez les talents digitaux de la communauté Solicode. Connectez-vous et explorez leurs portfolios.
            </p>
        </div>

        <div class="filters-container" style="margin-bottom: 40px; display: flex; gap: 12px; flex-wrap: wrap;">
            <button class="filter-btn active" data-filter="all">Tous</button>
            <button class="filter-btn" data-filter="mentor"><i data-lucide="award" style="width: 14px; height: 14px;"></i> Mentors</button>
            <button class="filter-btn" data-filter="en poste"><i data-lucide="briefcase" style="width: 14px; height: 14px;"></i> En Poste</button>
            <button class="filter-btn" data-filter="freelance"><i data-lucide="rocket" style="width: 14px; height: 14px;"></i> Freelance</button>
            <button class="filter-btn" data-filter="recherche"><i data-lucide="search" style="width: 14px; height: 14px;"></i> En Recherche</button>
            <button class="filter-btn" data-filter="études"><i data-lucide="graduation-cap" style="width: 14px; height: 14px;"></i> Études</button>
        </div>

        <style>
            .filter-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(140, 145, 196, 0.2);
                color: var(--muted);
                font-family: 'DM Sans', sans-serif;
                font-size: .85rem;
                font-weight: 500;
                cursor: pointer;
                transition: all .2s;
            }
            .filter-btn:hover {
                background: rgba(255, 255, 255, 0.1);
                color: var(--white);
            }
            .filter-btn.active {
                background: rgba(58, 69, 185, 0.2);
                border-color: var(--blue-lt);
                color: var(--white);
            }
            .filter-btn.active[data-filter="mentor"] { border-color: var(--yellow); background: rgba(245, 194, 40, 0.15); color: var(--yellow); }
        </style>

        <div id="laureats-grid" class="features-grid">
            <!-- Loader while fetching CSV -->
            <div style="color: var(--muted); font-family: 'Space Mono', monospace; padding: 40px 0;">
                <i data-lucide="loader" class="spinner" style="animation: spin 2s linear infinite; margin-right: 10px; vertical-align: middle;"></i>
                Chargement des profils...
            </div>
            <style>
                @keyframes spin { 100% { transform: rotate(360deg); } }
            </style>
        </div>
    </section>

    <div class="divider"></div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-logo">
            <img src="images/logo.png" alt="Solicode" style="height: 80px;">
            <span
                style="color:var(--muted); margin-left: -5px; font-family: 'Space Mono', monospace; font-size: .6rem; letter-spacing: .1em;">-
                ALUMNI</span>
        </div>
        <div class="footer-copy">© 2026 Solicode · Tous droits réservés</div>
        <div class="footer-links">
            <a href="#">LinkedIn</a>
        </div>
    </footer>
</body>

</html>
